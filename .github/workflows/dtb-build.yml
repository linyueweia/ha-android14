name: dtb-build

# 只编一个 dtb：rk3588-hlink-h88k.dtb
#
# 为什么不用友善 SDK 的 git clone：
#   gitea（112.124.9.243:3000）到 Azure runner 只有 ~200KB/s，
#   `git clone --filter=blob:none --no-checkout` 跑了 31 分钟连 clone 都没走完。
# 所以改成「把 dtb 的 #include 闭包（27 个 dtsi + dt-bindings 头，455KB）随仓库带走」，
# CI 侧只用 gcc -E + dtc，全程 20 秒内。
# 闭包由 tools/fetch_dts_tree.py 维护，校验：python tools/fetch_dts_tree.py --verify

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TREE: vendor/dts-tree
  RK: vendor/dts-tree/arch/arm64/boot/dts/rockchip
  DTB: out/rk3588-hlink-h88k.dtb

jobs:
  build-dtb:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dtc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler
          gcc --version | head -1; dtc --version

      - name: Sanity check vendored dts tree
        run: |
          set -euo pipefail
          test -f "$RK/rk3588.dtsi"                 || { echo "FATAL: 缺 rk3588.dtsi"; exit 1; }
          test -f "$RK/rk3588s.dtsi"                || { echo "FATAL: 缺 rk3588s.dtsi"; exit 1; }
          test -f "$RK/rk3588-android.dtsi"         || { echo "FATAL: 缺 rk3588-android.dtsi"; exit 1; }
          test -f "$RK/rk3588-rk806-single.dtsi"    || { echo "FATAL: 缺 rk3588-rk806-single.dtsi"; exit 1; }
          test -d "$TREE/include/dt-bindings"       || { echo "FATAL: 缺 dt-bindings"; exit 1; }
          echo "文件数: $(find "$TREE" -type f | wc -l)  大小: $(du -sh "$TREE" | cut -f1)"
          echo "== rk3588-android.dtsi 关键节点 =="
          grep -nE "optee|ramoops|drm[_-]logo|vendor[_-]storage|fiq-debugger|cma" "$RK/rk3588-android.dtsi" | head
          echo "== 本仓 dts 依赖的 label =="
          for L in vdd_log_s0 hdptxphy_hdmi0 vp0_out_hdmi0 vp1_out_hdmi1; do
            if grep -rqE "^[[:space:]]*$L:" "$RK"; then echo "label $L present"; else echo "MISSING LABEL: $L"; exit 1; fi
          done

      - name: Build dtb (cpp + dtc)
        run: |
          set -euo pipefail
          cp dts/rk3588-hlink-h88k-android.dts "$RK/rk3588-hlink-h88k.dts"
          # 与内核 scripts/Makefile.lib 的 dtc_cpp_flags 一致
          cpp -nostdinc -I"$TREE/include" -I"$RK" \
              -undef -D__DTS__ -x assembler-with-cpp \
              "$RK/rk3588-hlink-h88k.dts" -o /tmp/h88k.pre.dts
          wc -l /tmp/h88k.pre.dts
          # RK3588 的 dtsi 里满是 unit_address / 过时 gpio 写法，这些警告不重要
          dtc -I dts -O dtb -o /tmp/h88k.dtb /tmp/h88k.pre.dts 2>/tmp/dtc.log || {
            echo "===== DTC 失败 ====="; tail -40 /tmp/dtc.log; exit 1; }
          echo "===== dtc 警告（前 20 条）====="
          grep -E "^(Warning|ERROR)" /tmp/dtc.log | head -20 || true
          echo "警告总数: $(grep -cE '^Warning' /tmp/dtc.log || true)"
          mkdir -p out && cp /tmp/h88k.dtb "$DTB"
          sz=$(stat -c %s "$DTB"); echo "dtb size=$sz"
          # RK3588 带完整 SoC 描述的 dtb 在 180-260 KB；明显偏小说明只编了个壳
          [ "$sz" -gt 150000 ] || { echo "FATAL: dtb 只有 $sz B，明显没真编译"; exit 1; }
          python3 -c "
          import struct,sys
          d=open('$DTB','rb').read()
          magic,tot=struct.unpack('>II', d[:8])
          assert magic==0xd00dfeed, hex(magic)
          print(f'FDT magic OK, totalsize={tot} (file {len(d)})')
          "

      - name: Inspect generated dtb (Android nodes must be present)
        run: |
          set -euo pipefail
          python3 - "$DTB" <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import dtb_diff as D
          nodes, paths = D.load(sys.argv[1])
          def has(p):
              return p in nodes
          def has_node(prefix):
              """节点名常带 unit address（ramoops@110000 / drm-logo@0），按前缀找。"""
              return any(k == prefix or k.startswith(prefix + "@") for k in nodes)
          checks = {
              '/firmware/optee': 'optee (Android TEE)',
              '/reserved-memory/ramoops': 'ramoops',
              '/reserved-memory/drm-logo': 'drm-logo (开机 logo 内存)',
              '/vendor-storage': 'vendor-storage',
              '/fiq-debugger': 'fiq-debugger',
          }
          bad = []
          for p, what in checks.items():
              ok = has_node(p)
              print(('OK   ' if ok else 'MISS '), p, '-', what)
              if not ok: bad.append(p)
          ch = nodes.get('/chosen') or {}
          ba = (ch.get('bootargs') or b'').rstrip(b'\x00').decode('utf8', 'replace')
          print('chosen.bootargs =', ba[:160])
          if 'console=ttyFIQ0' not in ba:
              bad.append('/chosen bootargs 缺 console=ttyFIQ0')
          cma = nodes.get('/reserved-memory/cma') or {}
          print('cma keys =', sorted(k for k in cma if not k.startswith('linux,')))
          if 'size' in cma:
              bad.append('cma 同时有 size 和 reg（shared-dma-pool 会失败）')
          if 'reg' not in cma:
              bad.append('cma 缺 reg')
          # vop：厂商 A12 dtb 只有 assigned-clocks/rates + power-domains，
          # 不写 vop-supply（那是 RK3568 的形态；RK3588 VOP 走 power-domain）。
          vop = nodes.get('/vop@fdd90000') or nodes.get('/vop') or {}
          if 'vop-supply' in vop:
              bad.append('vop 出现 vop-supply（RK3588 不该有，厂商 dtb 也没有）')
          else:
              print('vop-supply absent (correct)')
          acr = vop.get('assigned-clock-rates')
          if acr is None:
              bad.append('vop 缺 assigned-clock-rates=<800MHz>')
          else:
              print('vop assigned-clock-rates =', int.from_bytes(acr[:4], 'big'))
          ds = nodes.get('/display-subsystem') or {}
          if 'clock-names' not in ds:
              bad.append('display-subsystem 缺 hdmi0_phy_pll 时钟')
          else:
              print('display-subsystem clock-names =',
                    (ds.get('clock-names') or b'').rstrip(b'\x00'))
          # 模型名要认得出是 H88K。注意 dtb_diff.load 的根节点路径是空串不是 "/"
          root = nodes.get('') or nodes.get('/') or {}
          print('model =', (root.get('model') or b'').rstrip(b'\x00').decode())
          print('compatible =', (root.get('compatible') or b'').rstrip(b'\x00').decode())
          if b'h88k' not in (root.get('compatible') or b''):
              bad.append('根 compatible 里没有 h88k')
          # 12 个 nanopi6 槽位要全部落进 boot.img，这里只确认单板 dtb 认得出自己是 H88K
          if bad:
              print('FATAL: Android 节点缺失：')
              for b in bad: print('  -', b)
              raise SystemExit(1)
          print('ALL ANDROID NODE CHECKS PASSED')
          PY

      - name: SoC IP enable matrix
        run: |
          set -euo pipefail
          python3 tools/dtb_features.py "$DTB" | tee /tmp/feat.txt
          {
            echo "## SoC IP matrix (H88K)"
            echo '```'
            cat /tmp/feat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dtb
        uses: actions/upload-artifact@v4
        with:
          name: h88k-dtb
          path: |
            out/rk3588-hlink-h88k.dtb
            /tmp/dtc.log
          retention-days: 30
